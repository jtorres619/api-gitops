replicaCount: 1

image:
  repository: node
  tag: 20-alpine
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 3000
  nodePort: 30080

appCode: |
  const http = require('http');

  const PORT = 3000;

  const server = http.createServer((req, res) => {
    res.writeHead(200, { 'Content-Type': 'text/html' });
    res.end('<html><body><h1>Hello from Node.js + Kubernetes!</h1><p>This website is deployed using a Helm chart.</p></body></html>');
  });

  server.listen(PORT, () => {
    console.log('Server running on port ' + PORT);
  });
